[platformio]
default_envs = nano

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    coryjfowler/mcp_can@^1.5.1
    sandeepmistry/LoRa@^0.8.0
build_flags =
    -I ../common
    -Wall -Wextra

[env:nano]
platform = atmelavr
board = nanoatmega328new   ; bootloader récent. Clones anciens : board = nanoatmega328
